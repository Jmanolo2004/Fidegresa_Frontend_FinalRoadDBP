<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#603f2a" />
    <meta name="description" content="Fidegresa, programa de fidelización para comercios locales." />
    <title>Fidegresa | Software de fidelización a tus clientes</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./pages/metricas.js" defer></script>
    <script src="./pages/tarjetas.js" defer></script>
    <script src="./pages/clientes.js" defer></script>
    <script src="./pages/ubicaciones.js" defer></script>
    <script src="./pages/resenas.js" defer></script>
    <script src="./pages/geolocalizacion.js" defer></script>
    <script src="./pages/configuracion.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#metricas" data-page="metricas" aria-label="Fidegresa, inicio">
          <img class="brand-logo" src="./assets/favicon.svg" alt="" />
          <span class="brand-copy"><strong>Fidegresa</strong><small>Fideliza y regresa</small></span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
          <span class="nav-label">Tu negocio</span>
          <a class="nav-link active" href="#metricas" data-page="metricas"><span class="sidebar-icon" data-icon="chart"></span>Métricas</a>
          <a class="nav-link" href="#clientes" data-page="clientes"><span class="sidebar-icon" data-icon="users"></span>Clientes</a>
          <a class="nav-link" href="#resenas" data-page="resenas"><span class="sidebar-icon" data-icon="star"></span>Reseñas</a>
          <span class="nav-label">Tu programa</span>
          <a class="nav-link" href="#tarjetas" data-page="tarjetas"><span class="sidebar-icon" data-icon="card"></span>Tarjetas</a>
          <a class="nav-link" href="#ubicaciones" data-page="ubicaciones"><span class="sidebar-icon" data-icon="pin"></span>Ubicaciones</a>
          <a class="nav-link" href="#geolocalizacion" data-page="geolocalizacion"><span class="sidebar-icon" data-icon="target"></span>Geolocalización</a>
          <span class="nav-label">Cuenta</span>
          <a class="nav-link" href="#configuracion" data-page="configuracion"><span class="sidebar-icon" data-icon="settings"></span>Configuración</a>
        </nav>
        <div class="sidebar-bottom">
          <button class="profile-mini" data-action="profile">
            <span class="avatar">MG</span><span><strong>María González</strong><small>Administradora</small></span><span class="profile-dots" data-icon="settings"></span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" data-action="menu" aria-label="Abrir menú"><span data-icon="menu"></span></button>
          <div class="breadcrumb"><span>Panel</span><span class="crumb-divider">/</span><strong id="breadcrumb-current">Métricas</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button notification-button" data-action="notifications" aria-label="Notificaciones"><span data-icon="bell"></span><i></i></button>
            <button class="top-avatar" data-action="profile" aria-label="Abrir perfil">MG</button>
          </div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite"></section>
        <footer class="footer"><span>© 2025 Fidegresa</span><span>Hecho para los negocios de tu comunidad <b></b></span></footer>
      </main>
    </div>
    <dialog class="modal" id="app-modal"><form method="dialog" class="modal-card" id="modal-form"></form></dialog>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>
